name: Deploy Knowledge Base to GitHub Pages

# 1. Triggern: Körs automatiskt så fort du skickar upp (pushar) ny kod till main-branchen
on:
  push:
    branches:
      - main

# 2. Rättigheter för att publicera
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Körs på en virtuell Linux-maskin i molnet!
    
    steps:
      # Steg A: Hämta koden från ditt repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # Steg B: Ladda upp HTML-filerna till GitHub Pages
      - name: Setup Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
